# default execution config - can be overridden with -Dkey=value from CLI/CI
baseUrl=https://automationexercise.com
browser=chrome
headless=false
implicitWaitSeconds=2
explicitWaitSeconds=15
pageLoadTimeoutSeconds=30

# screen sizes the responsive suite cycles through, format WIDTHxHEIGHT
viewport=1920x1080

screenshotOnFailureDir=target/screenshots
